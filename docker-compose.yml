services:
  db:
    image: postgres:17-alpine
    container_name: bot_platform_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-browser_bot}
      POSTGRES_DB: ${POSTGRES_DB:-browser_bot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-browser_bot} -d ${POSTGRES_DB:-browser_bot}"]
      interval: 5s
      timeout: 5s
      retries: 5

  selenium:
    build: ./selenium
    image: browser-bot-selenium:custom
    container_name: browser-bot-selenium
    shm_size: 2gb
    environment:
      SE_NODE_SESSION_TIMEOUT: "3600"
      SE_SESSION_REQUEST_TIMEOUT: "30"
    ports:
      - "127.0.0.1:4444:4444"
      - "127.0.0.1:7900:7900"

  migration:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: browser-bot-backend:latest
    container_name: bot_platform_migration
    restart: "no"
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-browser_bot}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-browser_bot}
    depends_on:
      db:
        condition: service_healthy

  api:
    image: browser-bot-backend:latest
    container_name: bot_platform_api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-browser_bot}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-browser_bot}
      SELENIUM_REMOTE_URL: http://selenium:4444
      ARCAPTCHA_USERNAME: ${ARCAPTCHA_USERNAME}
      ARCAPTCHA_PASSWORD: ${ARCAPTCHA_PASSWORD}
      ARCAPTCHA_TARGET_URL: ${ARCAPTCHA_TARGET_URL:-https://demo.arcaptcha.co}
    depends_on:
      db:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/api/health\")'"]
      interval: 5s
      timeout: 5s
      retries: 5

  worker:
    image: browser-bot-backend:latest
    container_name: bot_platform_worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-browser_bot}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-browser_bot}
      SELENIUM_REMOTE_URL: http://selenium:4444
      ARCAPTCHA_USERNAME: ${ARCAPTCHA_USERNAME}
      ARCAPTCHA_PASSWORD: ${ARCAPTCHA_PASSWORD}
      ARCAPTCHA_TARGET_URL: ${ARCAPTCHA_TARGET_URL:-https://demo.arcaptcha.co}
    command: python -m app.execution.worker
    depends_on:
      api:
        condition: service_healthy
      selenium:
        condition: service_started
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: browser-bot-frontend:latest
    container_name: bot_platform_frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pg_data:
