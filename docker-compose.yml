services:
  db:
    image: postgres:17-alpine
    container_name: bot_platform_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-browser_bot}
      POSTGRES_DB: ${POSTGRES_DB:-browser_bot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-browser_bot} -d ${POSTGRES_DB:-browser_bot}"]
      interval: 5s
      timeout: 5s
      retries: 5

  selenium:
    build:
      context: .
      dockerfile: docker/selenium/Dockerfile
    image: browser-bot-selenium:custom
    container_name: browser-bot-selenium
    shm_size: 2gb
    environment:
      SE_NODE_SESSION_TIMEOUT: "3600"
      SE_SESSION_REQUEST_TIMEOUT: "30"
      TZ: Asia/Tehran
    ports:
      - "127.0.0.1:4444:4444"
      - "127.0.0.1:7900:7900"

volumes:
  pg_data:
